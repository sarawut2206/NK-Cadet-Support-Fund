<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ระบบโครงการ | โรงเรียนมัธยมวัดหนองแขม</title>
<meta name="description" content="จัดทำเอกสารโครงการครบวงจร ตั้งแต่บันทึกขออนุมัติ เอกสารแนบ คำสั่ง แบบประเมิน จนถึงเล่มรายงานสรุปผลและแบบตรวจสอบมาตรฐานการจัดโครงการ">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%230E2A56'/><text y='72' x='50' text-anchor='middle' font-size='62' fill='%23FFC72C' font-family='sans-serif'>P</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=Bai+Jamjuree:wght@500;600;700&display=swap">
<style>
:root{
  --navy:#10305F; --navy-2:#1B4A8F; --navy-3:#2C63B0;
  --gold:#F5B722; --gold-2:#FFD152; --gold-ink:#8A6410; --gold-ghost:rgba(245,183,34,.15);
  --ground:#EDF4FD; --surface:#FFFFFF; --surface-2:#DCE9F9;
  --ink:#0F2140; --ink-2:#3D5375; --ink-3:#5F7492;
  --rule:#C7DCF3; --rule-2:#9CBADF;
  --ok:#2E6B4F; --ok-bg:#E3F2EA; --warn:#9A6B00; --warn-bg:#FFF3D6; --bad:#9B2C2C;
  --ui:'Bai Jamjuree','Sarabun',system-ui,sans-serif;
  --doc:'TH Sarabun New','TH SarabunPSK','Sarabun',system-ui,serif;
  --body:'Sarabun',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0A1526; --surface:#132034; --surface-2:#1C2B42;
    --ink:#E6EBF3; --ink-2:#AFBACC; --ink-3:#8391A6;
    --rule:#26344E; --rule-2:#3E506F;
    --navy:#0A1830; --navy-2:#22508F; --navy-3:#4B82D8;
    --gold:#FFC72C; --gold-2:#FFD766; --gold-ink:#FFC72C; --gold-ghost:rgba(255,199,44,.14);
    --ok:#6FBF95; --ok-bg:rgba(111,191,149,.14); --warn:#E0B34D; --warn-bg:rgba(224,179,77,.14); --bad:#E08A8A;
  }
}
:root[data-theme="dark"]{
  --ground:#0A1526; --surface:#132034; --surface-2:#1C2B42;
  --ink:#E6EBF3; --ink-2:#AFBACC; --ink-3:#8391A6;
  --rule:#26344E; --rule-2:#3E506F;
  --navy:#0A1830; --navy-2:#22508F; --navy-3:#4B82D8;
  --gold:#FFC72C; --gold-2:#FFD766; --gold-ink:#FFC72C; --gold-ghost:rgba(255,199,44,.14);
  --ok:#6FBF95; --ok-bg:rgba(111,191,149,.14); --warn:#E0B34D; --warn-bg:rgba(224,179,77,.14); --bad:#E08A8A;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--navy-3);outline-offset:2px;border-radius:5px}

/* ── top bar ─────────────────────────────── */
.top{background:var(--navy);color:#fff;border-bottom:3px solid var(--gold);position:sticky;top:0;z-index:40}
.top-in{display:flex;align-items:center;gap:.9rem;padding:.6rem clamp(.8rem,2vw,1.4rem);flex-wrap:wrap}
.mark{width:2.35rem;height:2.35rem;flex:none;background:var(--gold);color:var(--navy);display:grid;place-items:center;font-family:var(--ui);font-weight:700;font-size:.8rem;clip-path:polygon(50% 0,100% 24%,100% 76%,50% 100%,0 76%,0 24%)}
.title{line-height:1.25;min-width:0}
.title b{display:block;font-family:var(--ui);font-weight:600;font-size:.98rem;color:#fff}
.title span{font-size:.76rem;color:#B6C6E0}
.top .spacer{margin-inline-start:auto}
.tabs{display:flex;gap:.25rem;flex-wrap:wrap}
.tabs a{font-family:var(--ui);font-weight:600;font-size:.83rem;text-decoration:none;color:#C6D4EA;padding:.4rem .85rem;border-radius:5px;border:1px solid transparent}
.tabs a:hover{background:rgba(255,255,255,.1);color:#fff}
.tabs a[aria-current]{background:var(--gold);color:var(--navy)}
.tbtn{font-family:var(--ui);font-weight:600;font-size:.82rem;background:transparent;color:#D7E2F4;border:1px solid rgba(255,255,255,.28);padding:.4rem .8rem;border-radius:5px;cursor:pointer}
.tbtn:hover{background:rgba(255,255,255,.1);color:#fff}
.tbtn.gold{background:var(--gold);color:var(--navy);border-color:var(--gold)}
.tbtn.gold:hover{background:var(--gold-2)}
@media(min-width:1201px){#btnToggle{display:none}}

/* ── layout ─────────────────────────────── */
.app{display:grid;grid-template-columns:16rem 25rem 1fr;height:calc(100vh - 3.6rem);min-height:0}
@media(max-width:1200px){.app{grid-template-columns:15rem 1fr}.pane-preview{display:none}.app.showprev .pane-edit{display:none}.app.showprev .pane-preview{display:block}}
@media(max-width:760px){.app{grid-template-columns:1fr;height:auto}.pane-list{border-inline-end:none;border-bottom:1px solid var(--rule)}}
.pane{overflow-y:auto;min-height:0}
.pane-list{background:var(--surface);border-inline-end:1px solid var(--rule);padding-bottom:2rem}
.pane-edit{background:var(--surface);border-inline-end:1px solid var(--rule);padding:1rem 1rem 5rem}
.pane-preview{background:var(--surface-2);padding:1.2rem;display:flex;justify-content:center;align-items:flex-start}

/* ── รายการเอกสารตามขั้นตอน ── */
.prog{margin:.9rem .9rem .3rem;padding:.75rem .8rem;border:1px solid var(--rule);border-radius:8px;background:var(--ground)}
.prog b{font-family:var(--ui);font-size:.82rem;font-weight:600;color:var(--ink)}
.prog .bar{height:.5rem;border-radius:99px;background:var(--surface-2);margin:.45rem 0 .3rem;overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--gold);border-radius:99px}
.prog span{font-size:.74rem;color:var(--ink-3)}
.phase{display:flex;align-items:center;gap:.5rem;font-family:var(--ui);font-size:.72rem;font-weight:600;letter-spacing:.06em;color:var(--ink-3);padding:1rem .95rem .35rem}
.phase .pd{width:1.45rem;height:1.45rem;border-radius:50%;background:var(--navy-2);color:#fff;display:grid;place-items:center;font-size:.72rem;flex:none}
.item{display:flex;gap:.55rem;align-items:flex-start;width:100%;text-align:start;background:none;border:none;border-inline-start:4px solid transparent;padding:.48rem .95rem;cursor:pointer;line-height:1.35}
.item .st{flex:none;width:.7rem;height:.7rem;border-radius:50%;margin-top:.3rem;border:2px solid var(--rule-2)}
.item .st.ok{background:var(--ok);border-color:var(--ok)}
.item .st.part{background:var(--gold);border-color:var(--gold)}
.item b{display:block;font-family:var(--ui);font-weight:500;font-size:.86rem;color:var(--ink)}
.item span.d{display:block;font-size:.74rem;color:var(--ink-3)}
.item:hover{background:var(--gold-ghost)}
.item[aria-current="true"]{background:var(--gold-ghost);border-inline-start-color:var(--gold)}
.item[aria-current="true"] b{color:var(--navy-3);font-weight:600}

/* ── แผงแก้ไข ── */
.fh{font-family:var(--ui);font-weight:600;font-size:1.02rem;color:var(--ink);margin:0 0 .15rem}
.fsub{font-size:.82rem;color:var(--ink-3);margin:0 0 .8rem;line-height:1.55}
.need{border:1px solid var(--rule);border-radius:8px;padding:.6rem .75rem;margin:0 0 .9rem;font-size:.8rem;line-height:1.55}
.need.ok{background:var(--ok-bg);border-color:transparent;color:var(--ok)}
.need.warn{background:var(--warn-bg);border-color:transparent;color:var(--ink-2)}
.need b{font-family:var(--ui);font-weight:600}
.need ul{margin:.25rem 0 0;padding-inline-start:1.1rem}
details.sec{border:1px solid var(--rule);border-radius:8px;margin-bottom:.6rem;background:var(--surface)}
details.sec>summary{list-style:none;cursor:pointer;padding:.6rem .8rem;display:flex;align-items:center;gap:.5rem;font-family:var(--ui);font-weight:600;font-size:.88rem;color:var(--ink)}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::before{content:"▸";color:var(--ink-3);font-size:.8rem;transition:transform .15s}
details.sec[open]>summary::before{transform:rotate(90deg)}
details.sec>summary .use{margin-inline-start:auto;font-size:.68rem;font-weight:600;color:var(--gold-ink);background:var(--gold-ghost);border-radius:99px;padding:.05rem .5rem}
details.sec>.bd{padding:.2rem .8rem .8rem;border-top:1px solid var(--rule)}
details.sec.hot{border-color:var(--gold)}
.field{margin:.55rem 0}
.field label{display:block;font-family:var(--ui);font-size:.76rem;font-weight:500;color:var(--ink-2);margin-bottom:.2rem}
.field input,.field select,.field textarea{width:100%;background:var(--ground);border:1px solid var(--rule);border-radius:5px;padding:.4rem .5rem;font-size:.86rem}
.field textarea{min-height:5.2rem;resize:vertical;line-height:1.6}
.field input:focus,.field select:focus,.field textarea:focus,.grid input:focus,.grid select:focus,.grid textarea:focus{border-color:var(--navy-3);background:var(--surface);outline:none}
.hint{font-size:.72rem;color:var(--ink-3);margin-top:.2rem;line-height:1.5}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:.55rem}
.two-col .field{margin:.55rem 0 0}
.chk-l{display:flex;gap:.5rem;align-items:flex-start;font-size:.82rem;line-height:1.45;padding:.22rem 0;cursor:pointer;color:var(--ink-2)}
.chk-l input{margin-top:.2rem;flex:none}
.stdh{font-family:var(--ui);font-size:.78rem;font-weight:600;color:var(--ink);margin:.7rem 0 .15rem}
/* ตารางแก้ไขรายการ */
.grid{width:100%;border-collapse:collapse;font-size:.8rem;margin:.5rem 0}
.grid th{font-family:var(--ui);font-weight:500;font-size:.7rem;color:var(--ink-3);text-align:start;padding:.15rem .2rem;white-space:nowrap}
.grid td{padding:.14rem .15rem;vertical-align:top}
.grid input,.grid select,.grid textarea{width:100%;background:var(--ground);border:1px solid var(--rule);border-radius:4px;padding:.28rem .35rem;font-size:.8rem;line-height:1.45}
.grid textarea{min-height:2.3rem;resize:vertical}
.grid input[type=number]{text-align:end;padding-inline:.25rem}
.grid .x{background:none;border:none;color:var(--ink-3);cursor:pointer;font-size:1rem;line-height:1;padding:.3rem .2rem}
.grid .x:hover{color:var(--bad)}
.grid tr.g td{padding-top:.5rem}
.grid .sum{font-family:var(--ui);font-weight:600;text-align:end;padding:.35rem .3rem;color:var(--ink)}
.grid .calc{font-size:.74rem;color:var(--ink-3);text-align:end;white-space:nowrap;padding-top:.45rem}
.addb{font-family:var(--ui);font-weight:600;font-size:.76rem;background:transparent;color:var(--navy-3);border:1px dashed var(--rule-2);border-radius:5px;padding:.3rem .7rem;cursor:pointer;margin-top:.2rem}
.addb:hover{background:var(--gold-ghost)}
.acts{display:flex;gap:.5rem;flex-wrap:wrap;margin:.9rem 0 .4rem}
.btn{font-family:var(--ui);font-weight:600;font-size:.84rem;border:1px solid var(--navy-2);background:var(--navy-2);color:#fff;padding:.46rem .95rem;border-radius:5px;cursor:pointer}
.btn:hover{background:var(--navy-3);border-color:var(--navy-3)}
.btn.sec{background:transparent;color:var(--navy-3);border-color:var(--rule-2)}
.btn.sec:hover{background:var(--gold-ghost)}
.btn.sm{font-size:.76rem;padding:.3rem .7rem}
.tip{background:var(--gold-ghost);border-inline-start:4px solid var(--gold);border-radius:0 8px 8px 0;padding:.6rem .8rem;font-size:.78rem;color:var(--ink-2);line-height:1.6;margin-top:.8rem}
.tip b{color:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem;margin:.5rem 0}
.kpi{background:var(--ground);border:1px solid var(--rule);border-radius:6px;padding:.4rem .5rem}
.kpi b{display:block;font-family:var(--ui);font-weight:600;font-size:.95rem;color:var(--ink)}
.kpi span{font-size:.68rem;color:var(--ink-3)}
.ph-grid{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin:.5rem 0}
.ph-card{border:1px solid var(--rule);border-radius:6px;overflow:hidden;background:var(--ground)}
.ph-card img{display:block;width:100%;height:6.5rem;object-fit:cover}
.ph-card input{width:100%;border:none;border-top:1px solid var(--rule);background:var(--surface);padding:.3rem .4rem;font-size:.76rem}
.ph-card .row{display:flex;gap:.2rem;padding:.2rem .3rem;justify-content:flex-end}
.ph-card .row button{background:none;border:1px solid var(--rule);border-radius:4px;font-size:.72rem;padding:.05rem .4rem;cursor:pointer;color:var(--ink-2)}
.ph-card .row button:hover{border-color:var(--bad);color:var(--bad)}

.card{border:1px solid var(--rule);border-radius:6px;padding:.4rem .45rem;margin:.4rem 0;background:var(--ground);display:grid;gap:.25rem}
.card .ch{display:flex;align-items:center;gap:.35rem;font-family:var(--ui);font-size:.76rem;color:var(--ink-2)}
.card .ch b{font-weight:600;white-space:nowrap}
.card .ch select,.card .ch input{flex:1;min-width:0}
.card .grow{flex:1}
.card input,.card select,.card textarea{width:100%;background:var(--surface);border:1px solid var(--rule);border-radius:4px;padding:.28rem .38rem;font-size:.8rem;line-height:1.45}
.card textarea{min-height:2.3rem;resize:vertical}
.card input[type=number]{text-align:end}
.card .x{background:none;border:none;color:var(--ink-3);cursor:pointer;font-size:.95rem;line-height:1;padding:.2rem .25rem;flex:none}
.card .x:hover{color:var(--bad)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:.25rem}
.g3{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:.25rem}
.g4{display:grid;grid-template-columns:1fr 1fr 1fr 1.3fr;gap:.25rem;align-items:center}
.calc{font-size:.74rem;color:var(--ink-2);text-align:end;white-space:nowrap}
.sitem{border-top:1px dashed var(--rule);padding-top:.3rem;display:grid;gap:.2rem}
.freq{display:grid;grid-template-columns:repeat(5,1fr) 5.2rem 1.3rem;gap:.2rem;align-items:end}
.freq label{display:grid;gap:.05rem;font-size:.66rem;color:var(--ink-3);text-align:center}
.freq input{padding:.2rem .15rem!important;text-align:center!important}
.card .mem{display:grid;grid-template-columns:1.2fr 1.3fr 1fr 1.3rem;gap:.2rem;align-items:center}
.sep{font-family:var(--ui);font-size:.7rem;font-weight:600;letter-spacing:.08em;color:var(--ink-3);margin:1.2rem 0 .4rem;text-transform:uppercase}

/* ── แผ่นกระดาษ A4 ─────────────────────────────── */
.sheet-wrap{display:flex;flex-direction:column;gap:8mm;align-items:center}
.sheet{width:210mm;min-height:297mm;background:#fff;color:#000;padding:15mm 20mm 20mm 30mm;box-shadow:0 3px 18px rgba(16,48,95,.20);font-family:var(--doc);font-size:16pt;line-height:1.36;position:relative}
.sheet.land{width:297mm;min-height:210mm;padding:12mm 15mm}
.sheet.tight{line-height:1.27}
.sheet.tight p{margin-bottom:1.2mm}
.sheet *{box-sizing:border-box}
.sheet .ctr{text-align:center}
.sheet .rt{text-align:right}
.sheet h1{font-size:22pt;font-weight:700;text-align:center;margin:0 0 2mm;line-height:1.25}
.sheet h2{font-size:18pt;font-weight:700;text-align:center;margin:0 0 4mm;line-height:1.3}
.sheet h3{font-size:16pt;font-weight:700;margin:3mm 0 1.5mm}
.sheet h4{font-size:16pt;font-weight:700;margin:2mm 0 1mm;text-indent:10mm}
.sheet .krut{display:block;margin:0 auto 3mm;height:30mm;width:auto}
.sheet .krut.sm{height:15mm;margin:0 0 1mm}
.sheet .hr{border-bottom:1.2px solid #000;margin:2mm 0 3mm}
.sheet p{margin:0 0 1.6mm;text-indent:0}
.sheet p.ind{text-indent:25mm;text-align:left}
.sheet p.i1{margin-left:10mm}
.sheet p.i2{margin-left:18mm;text-indent:-8mm}
.sheet .mhead{display:flex;align-items:flex-end;margin-bottom:1mm}
.sheet .mhead .krut.sm{margin:0}
.sheet .mhead h1{flex:1;margin:0 15mm 0 0;padding-bottom:1mm}
.sheet table.mem{margin:0 0 1mm}
.sheet table.mem td{border:none;padding:.2mm 1mm;font-size:16pt;line-height:1.36}
.sheet .meta{display:flex;justify-content:space-between;gap:6mm;margin-bottom:1mm}
.sheet table{width:100%;border-collapse:collapse;font-size:15pt;margin:2mm 0 3mm}
.sheet th,.sheet td{border:1px solid #000;padding:1.1mm 2mm;vertical-align:top;line-height:1.3}
.sheet th{background:#EDEFF3;font-weight:700;text-align:center}
.sheet td.n{text-align:right;white-space:nowrap}
.sheet td.c{text-align:center;white-space:nowrap}
.sheet tr.tot td{font-weight:700}
.sheet table.cmp th,.sheet table.cmp td{padding:.5mm 1.5mm;line-height:1.25}
.sheet tr.grp td{font-weight:700;background:#F5F6F9}
.sheet .rw{display:flex;gap:2mm;margin-bottom:1.2mm;align-items:baseline}
.sheet .rw .lb{white-space:nowrap}
.sheet .rw .vl{flex:1;border-bottom:1px dotted #444;padding-inline-start:2mm;min-height:1.4em}
.sheet .sig{display:block;margin-top:6mm;text-align:center;font-size:16pt}
.sheet .sig>div{display:inline-block;vertical-align:top;width:47%;margin:0 1% 4mm;break-inside:avoid}
.sheet .sig.one{max-width:85mm;margin-inline-start:auto}
.sheet .sig.one>div{width:100%;margin:0}
.sheet .sig div>span{display:block;line-height:1.45}
.sheet table.sigt{border-collapse:collapse;font-size:16pt;margin-bottom:0}
.sheet table.sigt td{border:none;padding:0 1mm;text-align:center;vertical-align:top}
.sheet table.sigt p.sl{margin:0;line-height:1.45;text-align:center}
.sheet .box{border:1.2px solid #000;padding:2mm 3mm;margin-top:2.5mm}
.sheet small{font-size:13pt;line-height:1.4;display:block}
.sheet .chk{display:inline-block;width:4.2mm;height:4.2mm;border:1.1px solid #000;margin-inline-end:1.6mm;vertical-align:-.5mm}
.sheet table.cm td{border:1px solid #000;width:50%;font-size:15pt;padding:1.2mm 2.5mm}
.sheet table.lay,.sheet table.lay td{border:none;padding:0}
.sheet .kv td:first-child{white-space:nowrap;font-weight:700;width:1%;padding-inline-end:4mm}
.sheet .kv,.sheet .kv td{border:none;padding:.3mm 0;font-size:16pt}
/* ปก */
.sheet .cover{min-height:262mm;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;padding:10mm 0 6mm}
.sheet .cover .ct{font-size:28pt;font-weight:700;line-height:1.3}
.sheet .cover .cn{font-size:24pt;font-weight:700;line-height:1.35;margin-top:6mm}
.sheet .cover .cs{font-size:18pt;font-weight:700;line-height:1.5}
.sheet .cover img.logo{display:block;margin:0 auto}
.sheet .divider{min-height:262mm;display:flex;align-items:center;justify-content:center;font-size:36pt;font-weight:700}
/* สารบัญ */
.sheet .toc{display:flex;align-items:baseline;gap:2mm;margin-bottom:1.2mm}
.sheet .toc .tt{white-space:nowrap}
.sheet .toc .ld{flex:1;border-bottom:1.4px dotted #555;transform:translateY(-1.4mm)}
.sheet .toc .pg{min-width:10mm;text-align:right}
.sheet .toc.sub{padding-inline-start:8mm}
/* ภาพกิจกรรม */
.sheet table.photos,.sheet table.photos td{border:none}
.sheet table.photos td{width:50%;text-align:center;padding:2mm 2mm 4mm;vertical-align:top;font-size:14pt;line-height:1.3}
.sheet table.photos img{display:block;margin:0 auto 1.5mm;border:1px solid #999}
.sheet .ok{font-weight:700}
.sheet .mk{font-family:'Segoe UI Symbol','Sarabun',sans-serif}
.sheet .note{font-size:13pt;color:#333}

@media(max-width:1600px){.sheet-wrap{zoom:.8}}
@media(max-width:1400px){.sheet-wrap{zoom:.68}}

/* ── พิมพ์ ─────────────────────────────── */
@media print{
  body{background:#fff}
  .top,.pane-list,.pane-edit,.noprint{display:none!important}
  .app{display:block;height:auto}
  .pane-preview{display:block!important;padding:0;background:#fff;overflow:visible}
  .sheet-wrap{zoom:1!important;display:block}
  .sheet{box-shadow:none;width:auto;min-height:0;margin:0;padding:0}
  .sheet.land{width:auto;padding:0;min-height:0}
  .sheet + .sheet{break-before:page}
  .sheet .cover,.sheet .divider{min-height:255mm}
  .sheet table{break-inside:auto}
  .sheet tr,.sheet .box,.sheet .rw,.sheet h3,.sheet h4,.sheet .sig,.sheet table.cm{break-inside:avoid}
  .sheet h3,.sheet h4{break-after:avoid}
  .sheet thead{display:table-header-group}
  #rul{display:none!important}
}

/* ═══════════ รูปภาพ (เก็บใน IndexedDB เพราะ localStorage จุได้น้อย) ═══════════ */
const MEDIA = {};   // id → { src, w, h }
const IDB = {
  db: null,
  open(){
    return new Promise(res => {
      try {
        const rq = indexedDB.open("nk_proj_media", 1);
        rq.onupgradeneeded = () => rq.result.createObjectStore("m");
        rq.onsuccess = () => { this.db = rq.result; res(true); };
        rq.onerror = () => res(false);
      } catch (e) { res(false); }
    });
  },
  tx(mode){ return this.db.transaction("m", mode).objectStore("m"); },
  put(id, v){ return new Promise(r => { if (!this.db) return r(); const q = this.tx("readwrite").put(v, id); q.onsuccess = q.onerror = () => r(); }); },
  del(id){ return new Promise(r => { if (!this.db) return r(); const q = this.tx("readwrite").delete(id); q.onsuccess = q.onerror = () => r(); }); },
  all(){
    return new Promise(r => {
      if (!this.db) return r({});
      const out = {}, q = this.tx("readonly").openCursor();
      q.onsuccess = () => { const c = q.result; if (c){ out[c.key] = c.value; c.continue(); } else r(out); };
      q.onerror = () => r(out);
    });
  }
};
/** ย่อรูปให้ด้านยาวไม่เกิน max px แล้วเก็บเป็น JPEG (หรือ PNG สำหรับตราโรงเรียน) */
function shrink(file, max, png){
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => {
      const im = new Image();
      im.onload = () => {
        const k = Math.min(1, max / Math.max(im.width, im.height));
        const w = Math.round(im.width * k), h = Math.round(im.height * k);
        const c = document.createElement("canvas"); c.width = w; c.height = h;
        const g = c.getContext("2d");
        if (!png){ g.fillStyle = "#fff"; g.fillRect(0, 0, w, h); }
        g.drawImage(im, 0, 0, w, h);
        res({ src: c.toDataURL(png ? "image/png" : "image/jpeg", .8), w, h });
      };
      im.onerror = () => rej(new Error("อ่านรูปไม่ได้"));
      im.src = fr.result;
    };
    fr.onerror = () => rej(new Error("อ่านไฟล์ไม่ได้"));
    fr.readAsDataURL(file);
  });
}
/** <img> ขนาดพอดีกรอบ (มม.) ใส่ width/height เป็น attribute เพื่อให้ Word แสดงขนาดถูก */
function fitImg(m, boxW, boxH, cls){
  if (!m) return "";
  const k = Math.min(boxW / m.w, boxH / m.h);
  const wmm = m.w * k, hmm = m.h * k;
  const px = mm => Math.round(mm * 96 / 25.4);
  return `<img${cls ? ` class="${cls}"` : ""} src="${m.src}" width="${px(wmm)}" height="${px(hmm)}" style="width:${wmm.toFixed(1)}mm;height:${hmm.toFixed(1)}mm" alt="">`;
}

/** สถิติความพึงพอใจจากตารางความถี่ ๕ ระดับ · S.D. ใช้ตัวหาร n − 1 */
function statOf(freqs){
  let n = 0, sx = 0, sxx = 0;
  freqs.forEach(f => f.forEach((c, i) => { const k = N(c), x = 5 - i; n += k; sx += k * x; sxx += k * x * x; }));
  if (!n) return null;
  const m = sx / n;
  const sd = n > 1 ? Math.sqrt(Math.max(0, (sxx - n * m * m) / (n - 1))) : 0;
  return { n, m, sd, lv: level(Math.round(m * 100) / 100) };
}
function survey(){
  const groups = P.survey.map(g => ({ n: g.n, items: g.items.map(it => ({ t: it.t, s: statOf([it.f]) })), s: statOf(g.items.map(it => it.f)) }));
  const all = statOf(P.survey.flatMap(g => g.items.map(it => it.f)));
  const ns = P.survey.flatMap(g => g.items.map(it => it.f.reduce((a, c) => a + N(c), 0)));
  const resp = ns.length ? Math.max(...ns) : 0;
  const uneven = ns.some(x => x && x !== resp);
  const flat = groups.flatMap(g => g.items).filter(i => i.s);
  const hi = flat.slice().sort((a, b) => b.s.m - a.s.m)[0], lo = flat.slice().sort((a, b) => a.s.m - b.s.m)[0];
  return { groups, all, resp, uneven, hi, lo };
}

/* ── ข้อมูลจากหน้าสมรรถภาพ (อ่านอย่างเดียว · สรุปเป็นจำนวนคน ไม่แสดงชื่อ) ── */
const TESTS = [
  { k:"pu", n:"ท่าดันพื้น",       type:"reps", target:100, limit:240, unit:"ครั้ง" },
  { k:"pl", n:"ท่าดึงข้อ",        type:"reps", target:20,  limit:240, unit:"ครั้ง" },
  { k:"su", n:"ท่าลุก–นั่ง",      type:"reps", target:100, limit:240, unit:"ครั้ง" },
  { k:"rl", n:"วิ่ง 1,000 เมตร",  type:"ms",   limit:360 },
  { k:"rs", n:"วิ่ง 50 เมตร",     type:"sec",  limit:8 }
];
const fmtMS = v => `${Math.floor(v / 60)}:${String(Math.round(v % 60)).padStart(2, "0")}`;
const critText = t => t.type === "reps" ? `${t.target} ${t.unit} ภายใน ${fmtMS(t.limit)} นาที`
  : t.type === "ms" ? `ภายใน ${fmtMS(t.limit)} นาที` : `ภายใน ${t.limit} วินาที`;
function passOf(t, v){
  if (!v) return null;
  if (t.type === "reps"){
    if (v.r == null && v.t == null) return null;
    if (v.t != null && v.r == null) return v.t <= t.limit;
    if (v.r == null) return null;
    return v.r >= t.target && (v.t == null || v.t <= t.limit);
  }
  if (v.t == null) return null;
  return v.t <= t.limit;
}
const trendVal = (t, v) => !v ? null : t.type === "reps" ? (v.r ?? null) : (v.t ?? null);
function readLS(k){ try { return JSON.parse(localStorage.getItem(k) || "null"); } catch (e) { return null; } }
function fitSummary(){
  const F = readLS("nk_fit_v1");
  if (!F || !Array.isArray(F.rounds) || !Array.isArray(F.students)) return null;
  const res = F.res || {};
  const R = (r, s) => res[r.id + "|" + s.id];
  const rounds = F.rounds.slice().sort((a, b) => (a.date || "").localeCompare(b.date || ""));
  const dr = rounds.filter(r => F.students.some(s => R(r, s)));
  if (dr.length < 2) return { ok:false, n: dr.length };
  const a = dr[0], b = dr[dr.length - 1];
  const rows = TESTS.map(t => {
    let p1 = 0, n1 = 0, p2 = 0, n2 = 0;
    F.students.forEach(s => {
      const q1 = passOf(t, (R(a, s) || {})[t.k]), q2 = passOf(t, (R(b, s) || {})[t.k]);
      if (q1 !== null){ n1++; if (q1) p1++; }
      if (q2 !== null){ n2++; if (q2) p2++; }
    });
    return { t, p1, n1, p2, n2 };
  });
  let imp = 0, comp = 0;
  F.students.forEach(s => {
    let up = 0, dn = 0, any = false;
    TESTS.forEach(t => {
      const x = trendVal(t, (R(a, s) || {})[t.k]), y = trendVal(t, (R(b, s) || {})[t.k]);
      if (x == null || y == null) return;
      any = true;
      const better = t.type === "reps" ? y > x : y < x, worse = t.type === "reps" ? y < x : y > x;
      if (better) up++; else if (worse) dn++;
    });
    if (any){ comp++; if (up > dn) imp++; }
  });
  return { ok:true, a, b, rows, imp, comp, nRounds: dr.length };
}

function docSched(){

function signDays(){
  const T = readLS("nk_tutor_v2");
  const wkday = k => { const w = dObj(k).getDay(); return w !== 0 && w !== 6; };
  let keys = [];
  if (T && T.days && okDate(P.start) && okDate(P.end))
    keys = Object.keys(T.days).filter(k => okDate(k) && k >= P.start && k <= P.end && T.days[k] && T.days[k].on !== false
      && (T.mode !== "weekday" || wkday(k))).sort();
  if (!keys.length && okDate(P.start) && okDate(P.end))
    for (let d = dObj(P.start); d <= dObj(P.end) && keys.length < 31; d.setDate(d.getDate() + 1)) if (wkday(iso(d))) keys.push(iso(d));
  return keys;
}

/* ═══════════ ข้อความสรุปผล (ใช้ร่วมกันทั้งบันทึกรายงานผลและเล่มรายงาน) ═══════════ */
function resultBullets(){
  const b = budget(), ind = indicators(), sv = survey(), aN = N(P.res.actualN), tN = N(P.targetN);
  const fit = P.res.fit === "1" ? fitSummary() : null;
  const out = [];
  out.push(has(P.res.actualN)
    ? `มีผู้เข้าร่วมโครงการ ${money0(aN)} คน จากกลุ่มเป้าหมาย ${money0(tN)} คน คิดเป็นร้อยละ ${pct(aN, tN)}`
    : `มีผู้เข้าร่วมโครงการ …… คน จากกลุ่มเป้าหมาย ${money0(tN)} คน`);
  out.push(ind.judged
    ? `ผลการดำเนินงานบรรลุตัวชี้วัดความสำเร็จ ${ind.met} จาก ${ind.total} ตัวชี้วัด คิดเป็นร้อยละ ${pct(ind.met, ind.total)}`
    : `ผลการดำเนินงานตามตัวชี้วัดความสำเร็จ ……`);
  out.push(sv.all
    ? `ผู้ตอบแบบประเมิน ${sv.resp} คน มีความพึงพอใจต่อโครงการในภาพรวมอยู่ในระดับ${sv.all.lv} (x̄ = ${f2(sv.all.m)}, S.D. = ${f2(sv.all.sd)})`
    : `ความพึงพอใจของผู้เข้าร่วมโครงการในภาพรวมอยู่ในระดับ……`);
  if (P.source !== "ไม่ใช้") out.push(b.actAny
    ? `ใช้งบประมาณจริง ${money(b.actual)} บาท จากที่ได้รับอนุมัติ ${money(b.plan)} บาท คิดเป็นร้อยละ ${pct(b.actual, b.plan)} คงเหลือ ${money(b.plan - b.actual)} บาท`
    : `ใช้งบประมาณจริง …… บาท จากที่ได้รับอนุมัติ ${money(b.plan)} บาท`);
  if (fit && fit.ok && fit.comp)
    out.push(`นักเรียนร้อยละ ${pct(fit.imp, fit.comp)} มีผลการทดสอบสมรรถภาพทางร่างกายดีขึ้น เมื่อเทียบการทดสอบครั้งแรกกับครั้งล่าสุด`);
  return out;
}

     <p class="ind">เห็นควรรับทราบผลการดำเนินโครงการ และใช้เป็นข้อมูลวางแผนในปีการศึกษาต่อไป</p>

}

    <p class="ind">ขอขอบคุณผู้บริหารโรงเรียน คณะครู วิทยากร ผู้ปกครอง และผู้มีส่วนเกี่ยวข้องทุกท่าน ที่ให้การสนับสนุนจนโครงการสำเร็จลุล่วงด้วยดี</p>

  /* สารบัญ — เลขหน้าเติมหลังวาดหน้าจริง (fillToc) */
  const tocAt = pages.length;
  pages.push(null);

  /* บทสรุปสำหรับผู้บริหาร */
  const sug = lines(P.res.suggest);
  pages.push(sheet(`<h2 id="${T("t_exec", "บทสรุปสำหรับผู้บริหาร")}">บทสรุปสำหรับผู้บริหาร</h2>
    <p class="ind">${nm(P.title)} ปีการศึกษา ${num(Y())} ดำเนินการโดย${tx(S.plan)} ${tx(P.group)} ${tx(S.school)} ${tx(objText())} ดำเนินการ${rangeTxt()} ณ ${nm(P.place)} กลุ่มเป้าหมาย ได้แก่ ${nm(P.targetDesc)} จำนวน ${has(P.targetN) ? num(P.targetN) : dots(4)} คน${P.source === "ไม่ใช้" ? "" : ` ได้รับอนุมัติงบประมาณจาก${tx(srcText())} จำนวน ${num(money(b.plan))} บาท`}</p>
    <p class="ind">ผลการดำเนินงาน พบว่า ${resultBullets().map(tx).join(" ")}</p>

    ${sug.length ? `<p class="ind">ข้อเสนอแนะที่สำคัญ ได้แก่ ${tx(sug.slice(0, 3).join(" "))}</p>` : ""}`));

    ${H3("1.1", "ชื่อโครงการ")}<p class="ind">${nm(P.title)}</p>
    ${H3("1.2", "หลักการและเหตุผล")}${lines(P.rationale).map(p => `<p class="ind">${tx(p)}</p>`).join("") || dotsP()}
    ${H3("1.3", "วัตถุประสงค์")}${listP(objList()) || dotsP()}
    ${H3("1.4", "เป้าหมาย")}<h4>เชิงปริมาณ</h4>${tgt(q)}<h4>เชิงคุณภาพ</h4>${tgt(l)}
    ${H3("1.5", "ความสอดคล้องกับมาตรฐานการศึกษาของสถานศึกษา")}${stdFull() || dotsP()}
    ${has(P.strategy) ? `<p class="i1"><b>กลยุทธ์โรงเรียน</b> ${tx(P.strategy)}</p>` : ""}
    ${H3("1.6", "งบประมาณ")}<p class="ind">${fundLine()}</p>
    ${H3("1.7", "ผู้รับผิดชอบโครงการ")}<p class="ind">${nm(P.owner)} ${tx(P.ownerPos)} ${tx(P.group)}</p>`));

  /* ส่วนที่ ๒ */

  }
  const n33 = P.source === "ไม่ใช้" ? "3.2" : "3.3";
  p3 += H3(n33, "ผลการประเมินความพึงพอใจ", T("t33", num(n33) + " ผลการประเมินความพึงพอใจ", 1));
  if (sv.all){

    p3 += `<p class="ind">ผู้ตอบแบบประเมินความพึงพอใจ จำนวน ${num(sv.resp)} คน ผลการประเมินปรากฏดังตาราง</p>` +
      tcap("ผลการประเมินความพึงพอใจของผู้เข้าร่วมโครงการ") +
      `<table class="cmp" style="font-size:14pt"><thead><tr><th style="width:10mm">ที่</th><th>รายการประเมิน</th><th style="width:15mm">x̄</th><th style="width:15mm">S.D.</th><th style="width:25mm">ระดับ</th></tr></thead><tbody>
      ${sv.groups.map(g => `<tr class="grp"><td colspan="5">${nm(g.n)}</td></tr>` +

  } else p3 += `<p class="ind">ยังไม่ได้บันทึกผลการประเมินความพึงพอใจ</p>`;

      `<p class="ind">เปรียบเทียบผลการทดสอบครั้งแรก (${num(thDate(fit.a.date))}) กับครั้งล่าสุด (${num(thDate(fit.b.date))}) จากการทดสอบทั้งหมด ${num(fit.nRounds)} ครั้ง</p>` +
      tcap("จำนวนนักเรียนที่ผ่านเกณฑ์การทดสอบสมรรถภาพ") +
      `<table style="font-size:14pt"><thead><tr><th style="width:10mm">ที่</th><th>รายการทดสอบ</th><th style="width:38mm">เกณฑ์</th><th style="width:28mm">ครั้งแรก</th><th style="width:28mm">ครั้งล่าสุด</th><th style="width:20mm">เปลี่ยนแปลง</th></tr></thead><tbody>
      ${fit.rows.map((r, i) => `<tr><td class="c">${num(i + 1)}</td><td>${tx(r.t.n)}</td><td>${tx(critText(r.t))}</td><td class="c">${cell(r.p1, r.n1)}</td><td class="c">${cell(r.p2, r.n2)}</td><td class="c">${num((r.p2 - r.p1 >= 0 ? "+" : "") + (r.p2 - r.p1))} คน</td></tr>`).join("")}</tbody></table>
      <p class="ind">นักเรียนที่มีผลการทดสอบดีขึ้น (จำนวนรายการที่ดีขึ้นมากกว่ารายการที่ลดลง) มี ${num(fit.imp)} คน จาก ${num(fit.comp)} คน คิดเป็นร้อยละ ${num(pct(fit.imp, fit.comp))}</p>`;
  }
  pages.push(sheet(p3));

  /* ส่วนที่ ๔ */
  const ls = (t, empty) => lines(t).length ? listP(lines(t)) : `<p class="ind">${empty}</p>`;
  pages.push(sheet(`<h2 id="${T("t_p4", "ส่วนที่ " + num(4) + " สรุปผล ปัญหา อุปสรรค และข้อเสนอแนะ")}">ส่วนที่ ${num(4)}<br>สรุปผล ปัญหา อุปสรรค และข้อเสนอแนะ</h2>
    ${H3("4.1", "สรุปผลการดำเนินงาน")}${listP([...resultBullets(), ...lines(P.res.summary)])}

    ${H3("4.4", "แนวทางการพัฒนาในครั้งต่อไป")}${ls(P.res.next, dots(40))}
    <div class="sig" style="margin-top:10mm">${sigL("ผู้รายงาน", P.owner, P.ownerPos)}${sigL("ผู้ตรวจสอบ", P.deputy, P.deputyPos)}</div>
    <div class="sig one" style="margin-inline:auto">${sigL("ผู้รับรอง", S.director, "ผู้อำนวยการ" + S.school)}</div>`));

  /* ภาคผนวก */
  pages.push(sheet(`<p class="ctr" id="${T("t_app", "ภาคผนวก")}" style="margin-top:105mm;font-size:36pt;font-weight:700">ภาคผนวก</p>`));

  if (!ph.length) pages.push(sheet(headA + `<p class="ctr" style="margin-top:30mm">(แนบภาพกิจกรรม)</p>`));
  for (let i = 0; i < ph.length; i += 6){

  if (attach) app.forEach(([, f]) => pages.push(...f()));

  /* สารบัญ */
  pages[tocAt] = sheet(`<h2>สารบัญ</h2>
    <div class="toc" style="font-weight:700"><span class="tt">เรื่อง</span><span style="flex:1"></span><span class="pg">หน้า</span></div>

  return pages;
}

    ["P", "มีรายละเอียดประมาณการค่าใช้จ่ายที่ตรวจสอบได้", noB || (P.budget.length > 0 && P.budget.every(x => has(x.n) && N(x.q) && N(x.p))), "รายละเอียดค่าใช้จ่าย"],
    ["P", "กำหนดตัวชี้วัด วิธีการ และเครื่องมือประเมินผลครบทุกตัวชี้วัด", P.targets.length > 0 && P.targets.every(t => has(t.how) && has(t.tool)), "โครงการ ข้อ 6"],
    ["P", "โครงการได้รับอนุมัติจากผู้อำนวยการโรงเรียน", M("approved") || okDate(P.docs.approveDate), "บันทึกข้อความขออนุมัติ", "approved"],
    ["P", "มีคำสั่งแต่งตั้งคณะกรรมการดำเนินงาน", P.comm.length > 0 && (M("order") || has(P.docs.orderNo)), "คำสั่งโรงเรียน", "order"],
    ["D", "ดำเนินกิจกรรมตามกำหนดการที่วางไว้", M("onplan"), "กำหนดการ บันทึกการปฏิบัติงาน", "onplan"],
    ["D", "มีหลักฐานการเข้าร่วมกิจกรรมของกลุ่มเป้าหมาย", has(P.res.actualN), "ใบลงชื่อผู้เข้าร่วมโครงการ"],
    ["D", "มีภาพถ่ายหรือหลักฐานเชิงประจักษ์ของการดำเนินกิจกรรม", P.photos.length > 0, "ภาคผนวก ก ภาพกิจกรรม"],
    ["D", "เบิกจ่ายงบประมาณตามระเบียบ มีหลักฐานการจ่ายครบถ้วน", noB || (b.actDone && M("paid")), "หลักฐานการเบิกจ่าย", "paid"],
    ["C", "ประเมินผลตามตัวชี้วัดครบทุกตัวชี้วัด", ind.total > 0 && ind.judged === ind.total, "รายงานผล ส่วนที่ 3"],
    ["C", "ประเมินความพึงพอใจของผู้เข้าร่วมโครงการ", !!sv.all, "แบบประเมินความพึงพอใจ"],
    ["C", "เปรียบเทียบผลกับเป้าหมาย และสรุปการใช้งบประมาณ", ind.judged > 0 && (noB || b.actDone), "รายงานผล ส่วนที่ 3"],
    ["A", "วิเคราะห์ปัญหา อุปสรรค และจัดทำข้อเสนอแนะ", lines(P.res.problems).length > 0 && lines(P.res.suggest).length > 0, "รายงานผล ส่วนที่ 4"],
    ["A", "กำหนดแนวทางการพัฒนาในครั้งต่อไป", lines(P.res.next).length > 0, "รายงานผล ส่วนที่ 4"],
    ["A", "รายงานผลการดำเนินโครงการต่อผู้บริหาร", M("reported") || okDate(P.docs.repDate), "บันทึกข้อความรายงานผล", "reported"]
  ].map(([ph, t, ok, ev, mk]) => ({ ph, t, ok: !!ok, ev, mk }));
}
function qLevel(p){ return p >= 90 ? "ดีเยี่ยม" : p >= 80 ? "ดีมาก" : p >= 70 ? "ดี" : p >= 60 ? "พอใช้" : "ปรับปรุง"; }
function docCheck(){
  const c = checks(), ok = c.filter(x => x.ok).length, p = ok * 100 / c.length;
  let i = 0;
  const rows = ["P", "D", "C", "A"].map(ph => `<tr class="grp"><td colspan="4">${PH[ph]}</td></tr>` +
    c.filter(x => x.ph === ph).map(x => `<tr><td class="c">${num(++i)}</td><td>${tx(x.t)}</td><td>${tx(x.ev)}</td><td class="c">${x.ok ? "มี" : "ยังไม่มี"}</td></tr>`).join("")).join("");
  return [sheet(`<h2>แบบตรวจสอบมาตรฐานการจัดโครงการ<br>${nm(P.title)} ปีการศึกษา ${num(Y())}</h2>
    <table class="cmp" style="font-size:14pt"><thead><tr><th style="width:10mm">ที่</th><th>รายการตรวจสอบ</th><th style="width:46mm">หลักฐาน / เอกสารอ้างอิง</th><th style="width:20mm">ผล</th></tr></thead><tbody>${rows}</tbody></table>
    <p class="ind">สรุป ผ่าน ${num(ok)} จาก ${num(c.length)} รายการ คิดเป็นร้อยละ ${num(f2(p))} อยู่ในระดับคุณภาพ <b>${qLevel(p)}</b></p>
    <small>เกณฑ์ระดับคุณภาพ : ร้อยละ ${num(90)} ขึ้นไป = ดีเยี่ยม · ${num(80)}–${num(89.99)} = ดีมาก · ${num(70)}–${num(79.99)} = ดี · ${num(60)}–${num(69.99)} = พอใช้ · ต่ำกว่า ${num(60)} = ปรับปรุง</small>
    <div class="sig" style="margin-top:5mm">${sigL("ผู้รับผิดชอบโครงการ", P.owner, P.ownerPos)}${sigL("ผู้ตรวจสอบ", "", "หัวหน้างานประกันคุณภาพการศึกษา")}</div>`, "tight")];
}

/** รายการข้อมูลที่ยังขาด — ใช้บอกความพร้อมของเอกสารแต่ละฉบับ */
function needs(id){
  const m = [], b = budget();
  const req = (c, msg) => { if (!c && !m.includes(msg)) m.push(msg); };
  const base = () => { req(has(P.title), "ชื่อโครงการ"); req(okDate(P.start) && okDate(P.end), "วันเริ่ม–สิ้นสุดโครงการ"); req(has(P.place), "สถานที่"); };
  switch (id){
    case "memo": base(); req(has(P.owner), "ชื่อผู้รับผิดชอบโครงการ"); req(has(P.deputy), "ชื่อผู้เห็นชอบ (รองผู้อำนวยการ)");
      req(has(S.director), "ชื่อผู้อำนวยการ (ตั้งค่าที่หน้าศูนย์เอกสาร)"); req(objList().length, "วัตถุประสงค์");
      req(P.source === "ไม่ใช้" || b.plan > 0, "งบประมาณ"); req(okDate(P.docs.memoDate), "วันที่ของบันทึกขออนุมัติ"); break;
    case "project": base(); req(has(P.owner), "ชื่อผู้รับผิดชอบโครงการ"); req(has(P.rationale), "หลักการและเหตุผล"); req(objList().length, "วัตถุประสงค์");
      req(P.targets.length, "เป้าหมายและตัวชี้วัด"); req(P.std.length, "มาตรฐานที่สนอง"); req(has(P.strategy), "กลยุทธ์โรงเรียนที่สนอง");
      req(P.steps.length, "ขั้นตอนดำเนินงาน"); req(lines(P.expected).length, "ผลที่คาดว่าจะได้รับ"); break;
    case "budget": req(P.source === "ไม่ใช้" || (P.budget.length && P.budget.every(x => has(x.n) && N(x.q) && N(x.p))), "รายการงบประมาณให้ครบ (ชื่อ จำนวน ราคา)"); break;
    case "sched": req(P.sched.length, "กำหนดการอย่างน้อย ๑ รายการ"); req(P.sched.every(r => okDate(r.d) && has(r.act)), "วันที่และกิจกรรมของกำหนดการทุกแถว"); break;
    case "order": req(P.comm.length, "คณะกรรมการ"); req(has(S.director), "ชื่อผู้อำนวยการ (ตั้งค่าที่หน้าศูนย์เอกสาร)"); req(okDate(P.docs.orderDate), "วันที่สั่ง"); break;
    case "bundle": ["memo", "project", "budget", "sched", "order"].forEach(k => needs(k).forEach(x => req(false, x))); break;
    case "signin": base(); break;
    case "surveyform": req(P.survey.some(g => g.items.length), "ข้อคำถาม"); break;
    case "report": req(has(P.res.actualN), "จำนวนผู้เข้าร่วมจริง"); req(!!survey().all, "ผลแบบประเมินความพึงพอใจ");

      req(okDate(P.docs.repDate), "วันที่ของบันทึกรายงานผล"); break;
    case "book": needs("report").filter(x => !/วันที่ของบันทึก/.test(x)).forEach(x => req(false, x));
      req(lines(P.res.problems).length, "ปัญหาและอุปสรรค"); req(lines(P.res.suggest).length, "ข้อเสนอแนะ");
      req(lines(P.res.next).length, "แนวทางพัฒนาครั้งต่อไป"); req(P.photos.length, "ภาพกิจกรรม"); break;
    case "check": checks().filter(x => !x.ok).forEach(x => req(false, x.t)); break;
  }
  return m;
}

function fillToc(){
  const rul = $("#rul"), H = rul ? rul.offsetHeight : 0;
  if (!H) return;
  const padT = H * 15 / 262, padB = H * 20 / 262;
  let start = 1;
  const at = new Map();

/* ═══════════ นำเข้าจากตารางติว ═══════════ */
function tutor(){
  const T = readLS("nk_tutor_v2");
  if (!T || !T.days || typeof T.days !== "object") return null;
  const inR = k => (!T.start || k >= T.start) && (!T.end || k <= T.end);
  const wk = k => { const w = dObj(k).getDay(); return T.mode === "weekday" ? (w !== 0 && w !== 6) : T.mode === "skipsun" ? w !== 0 : true; };
  const keys = Object.keys(T.days).filter(k => okDate(k) && inR(k) && wk(k) && T.days[k] && T.days[k].on !== false && Array.isArray(T.days[k].rows)).sort();
  if (!keys.length) return null;
  const subj = Array.isArray(T.subjects) ? T.subjects : [];
  const SBn = k => (subj.find(s => s.k === k) || {}).n || "";
  const evAmt = r => (r.a === -1 || r.a == null || r.a === "") ? N(T.lecRate) : N(r.a);
  let periods = 0, fitDays = 0;
  const evs = [];
  keys.forEach(k => {
    let f = false;
    T.days[k].rows.forEach(r => { if (r.k === "sub" && r.s) periods++; if (r.k === "fit") f = true; if (r.k === "ev") evs.push(r); });
    if (f) fitDays++;
  });
  const paid = evs.filter(r => evAmt(r) > 0);
  const quota = subj.reduce((a, s) => a + N(s.q), 0);
  return { T, keys, SBn, subj, periods: periods || quota, filled: periods, fitDays, paid, evSum: paid.reduce((a, r) => a + evAmt(r), 0) };
}
function importBudget(){
  const t = tutor();
  if (!t) return toast("ยังไม่มีข้อมูลในหน้าตารางติว");
  const upsert = (name, q, u, p) => {
    let x = P.budget.find(b => b.n.startsWith(name));
    if (!q){ if (x) P.budget.splice(P.budget.indexOf(x), 1); return; }
    if (!x){ x = { c:"ตอบแทน", n:name, q:"", u, p:"", a:"" }; P.budget.unshift(x); }
    Object.assign(x, { q:String(q), u, p:String(p) });
  };
  upsert("ค่าตอบแทนวิทยากรบรรยายพิเศษ", t.paid.length, "ครั้ง", t.paid.length ? Math.round(t.evSum / t.paid.length) : N(t.T.lecRate));
  upsert("ค่าตอบแทนครูฝึกสมรรถภาพทางร่างกาย", t.fitDays, "วัน", N(t.T.fitRate));
  upsert("ค่าตอบแทนครูผู้สอนภาควิชาการ", t.periods, "คาบ", N(t.T.rate));
  P.targets.forEach(x => { if (x.unit === "คาบ") x.tgt = String(t.periods); if (x.unit === "วัน" && /สมรรถภาพ/.test(x.text)) x.tgt = String(t.fitDays); });
  if (N(t.T.students)) P.targetN = String(N(t.T.students));
  save(); renderAll();
  toast(`นำเข้าแล้ว : สอน ${t.periods} คาบ × ${money0(N(t.T.rate))} · ฝึก ${t.fitDays} วัน × ${money0(N(t.T.fitRate))} · วิทยากร ${t.paid.length} ครั้ง${t.filled ? "" : " (ยังไม่ได้ลงตาราง ใช้โควตาคาบแทน)"}`);
}
function importSched(){
  const t = tutor();
  if (!t) return toast("ยังไม่มีข้อมูลในหน้าตารางติว");
  const tm = s => String(s || "");
  P.sched = t.keys.map(k => {
    const rows = t.T.days[k].rows.filter(r => r.k !== "br").slice().sort((a, b) => tm(a.t1).localeCompare(tm(b.t1)));
    const t1 = rows.length ? rows[0].t1 : "", t2 = rows.reduce((a, r) => tm(r.t2) > a ? tm(r.t2) : a, "");
    const act = rows.map(r => r.k === "sub" ? (r.s ? t.SBn(r.s) : "ติวภาควิชาการ") : (r.l || (r.k === "fit" ? "ฝึกสมรรถภาพร่างกาย" : "กิจกรรม"))).join(" · ");
    return { d:k, d2:"", t: t1 && t2 ? `${t1}–${t2}` : "", act, who:"" };
  });
  P.start = t.keys[0]; P.end = t.keys[t.keys.length - 1];

}

const wcell = (html, style) => `<td style="border:none;padding:0;vertical-align:top;${style || ""}">${html}</td>`;
const wtable = (cells, mb) => `<table border="0" cellspacing="0" cellpadding="0" style="width:100%;border:none;border-collapse:collapse;margin:0 0 ${mb || "1.2mm"}"><tr>${cells.join("")}</tr></table>`;
/** Word ไม่รองรับ flexbox / grid / inline-block จึงแปลงเป็นตารางและย่อหน้าก่อนส่งออก */
function wordBody(sheetNode){
  const root = sheetNode.cloneNode(true);
  const F = s => document.createRange().createContextualFragment(s);
  root.querySelectorAll(".mhead").forEach(el => {
    const img = el.querySelector("img"), h = el.querySelector("h1");
    el.replaceWith(F(wtable([wcell(img ? img.outerHTML : "", "width:28mm;vertical-align:bottom"),
      wcell(`<p align="center" style="margin:0;text-align:center;font-size:22pt;font-weight:700">${h ? h.innerHTML : ""}</p>`, "vertical-align:bottom"),
      wcell("&nbsp;", "width:28mm")], "2mm")));
  });
  root.querySelectorAll("img.krut:not(.sm)").forEach(img => {
    const p = document.createElement("p"); p.setAttribute("align", "center"); p.style.margin = "0 0 3mm";
    img.replaceWith(p); p.appendChild(img);
  });
  root.querySelectorAll(".meta").forEach(el => {
    const k = [...el.children];
    el.replaceWith(F(wtable(k.map((c, i) => wcell(c.innerHTML, `width:${Math.floor(100 / k.length)}%;text-align:${i && i === k.length - 1 ? "right" : "left"}`)))));
  });
  root.querySelectorAll(".rw").forEach(el => {
    el.replaceWith(F(wtable([...el.children].map(c => c.classList.contains("vl")
      ? wcell(c.innerHTML || "&nbsp;", "border-bottom:1pt dotted #444;padding:0 0 0 2mm")
      : wcell(c.innerHTML, "white-space:nowrap;padding-right:2mm;width:1%")))));
  });
  root.querySelectorAll(".sig").forEach(el => {
    const blocks = [...el.children], one = el.classList.contains("one");
    const w = Math.floor(100 / Math.max(1, blocks.length));
    const cells = blocks.map(b => wcell([...b.children].map(s => `<p align="center" style="margin:0;line-height:1.45;text-align:center">${s.innerHTML}</p>`).join(""), `width:${one ? 50 : w}%;text-align:center`));
    if (one) cells.unshift(wcell("&nbsp;", "width:50%"));
    el.replaceWith(F(`<table border="0" cellspacing="0" cellpadding="0" style="width:100%;border:none;border-collapse:collapse;margin-top:7mm"><tr>${cells.join("")}</tr></table>`));
  });
  root.querySelectorAll(".toc").forEach(el => {
    const tt = el.querySelector(".tt"), pg = el.querySelector(".pg");
    el.replaceWith(F(wtable([wcell(tt ? tt.innerHTML : "", (el.classList.contains("sub") ? "padding-left:8mm;" : "") + (el.style.fontWeight ? "font-weight:700" : "")),
      wcell(pg ? pg.innerHTML : "", "width:18mm;text-align:right" + (el.style.fontWeight ? ";font-weight:700" : ""))], "1mm")));
  });
  root.querySelectorAll("table.lay, table.kv, table.photos, table.sigt").forEach(t => {
    t.setAttribute("border", "0"); t.style.border = "none";
    t.querySelectorAll("td").forEach(td => { td.style.border = "none"; });
  });
  /* ตารางลายมือชื่อ : Word ทำให้ตารางที่มี align ลอยและดันย่อหน้าก่อนหน้าไปไว้ใต้ตาราง
     จึงแปลงเป็นตารางเต็มความกว้างที่มีช่องว่างกันด้านซ้าย (ชิดขวา) หรือสองข้าง (กึ่งกลาง) แทน */
  root.querySelectorAll("table.sigt").forEach(tb => {
    const al = tb.getAttribute("align"), tr = tb.rows[0];
    tb.removeAttribute("align");
    const pad = w => { const td = document.createElement("td"); td.style.cssText = `border:none;width:${w}`; td.innerHTML = "&nbsp;"; return td; };
    if (tr && tr.cells.length === 1 && al === "right"){ tr.insertBefore(pad("50%"), tr.firstChild); tr.cells[1].style.width = "50%"; }
    else if (tr && tr.cells.length === 1 && al === "center"){ tr.insertBefore(pad("25%"), tr.firstChild); tr.appendChild(pad("25%")); tr.cells[1].style.width = "50%"; }
    tb.style.width = "100%"; tb.style.marginLeft = "0"; tb.style.marginRight = "0";
  });
  root.querySelectorAll("table.kv td:first-child").forEach(td => { td.style.whiteSpace = "nowrap"; td.style.fontWeight = "700"; td.style.width = "45mm"; });
  root.querySelectorAll("table.photos td").forEach(td => { td.setAttribute("align", "center"); td.style.textAlign = "center"; });
  root.querySelectorAll("small").forEach(el => {
    const p = document.createElement("p"); p.style.cssText = "margin:0 0 1mm;font-size:13pt"; p.innerHTML = el.innerHTML; el.replaceWith(p);
  });
  return root.innerHTML;
}
function wordHTML(){
  const d = doc();
  const sheets = [...pagesEl.querySelectorAll(".sheet")];
  const body = sheets.map(wordBody).join(`<br clear="all" style="page-break-before:always">`);
  const css = WORD_CSS.replace("PGSIZE", d.land ? "297.0mm 210.0mm" : "210.0mm 297.0mm")
    .replace("MARGIN", d.land ? "12.0mm 15.0mm 12.0mm 15.0mm" : "15.0mm 20.0mm 20.0mm 30.0mm")
    .replace("ORIENT", d.land ? "landscape" : "portrait");
  const html = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
<head><meta charset="utf-8"><title>${esc(d.n)}</title>
<!--[if gte mso 9]><xml><w:WordDocument><w:View>Print</w:View><w:Zoom>100</w:Zoom></w:WordDocument></xml><![endif]-->
<style>${css}</style></head><body><div class="WordSection1">${body}</div></body></html>`;
  return html;
}
function saveWord(){
  const d = doc();
  download(`${d.n}_${P.title ? P.title.slice(0, 40) + "_" : ""}${Y()}.doc`, "﻿" + wordHTML(), "application/msword");
}

/* ═══════════ เหตุการณ์ ═══════════ */
listEl.addEventListener("click", e => {
  const b = e.target.closest(".item");
  if (!b) return;
  cur = b.dataset.id; openSec = null;
  localStorage.setItem("nk_proj_doc", cur);
  renderAll();
  pagesEl.parentElement.scrollTop = 0; editEl.scrollTop = 0;
});
editEl.addEventListener("input", e => {
  const el = e.target;
  if (!el.dataset.p) return;
  setPath(P, el.dataset.p, el.value);
  save(); updateLive(); later();
});
editEl.addEventListener("change", e => {
  const el = e.target;
  if (el.id === "upPhoto"){ addPhotos([...el.files]); return; }
  if (el.id === "upLogo"){ if (el.files[0]) setLogo(el.files[0]); return; }
  if (el.id === "upProj"){ if (el.files[0]) importProject(el.files[0]); return; }
  if (el.dataset.std){
    const k = el.dataset.std;
    P.std = el.checked ? [...new Set([...P.std, k])] : P.std.filter(x => x !== k);
  } else if (el.dataset.flag) setPath(P, el.dataset.flag, el.checked ? "1" : "0");
  else if (el.dataset.man) P.manual[el.dataset.man] = el.checked ? "1" : "";
  else if (el.dataset.re){ save(); renderAll(); return; }
  else return;
  save(); renderList(); renderPreview();
  const nd = $("#need"); if (nd) nd.innerHTML = needHTML();
  if (el.dataset.man){ const s = editEl.querySelector('[data-sec="stat"] .bd'); if (s) s.innerHTML = secStat(); }
});
editEl.addEventListener("toggle", e => {
  const d = e.target.closest && e.target.closest("details.sec");
  if (!d || !openSec) return;
  if (d.open) openSec.add(d.dataset.sec); else openSec.delete(d.dataset.sec);
}, true);
const TPL = {
  targets: () => ({ t:"q", text:"", tgt:"", unit:"คน", how:"", tool:"", auto:"", res:"" }),
  steps: () => ({ ph:"D", act:"", when:"", who:"" }),
  sched: () => ({ d:P.start || "", d2:"", t:"", act:"", who:"" }),
  budget: () => ({ c:"ใช้สอย", n:"", q:"1", u:"", p:"", a:"" }),
  comm: () => ({ n:"คณะกรรมการ", duty:"", m:[{ name:"", pos:"", role:"ประธานกรรมการ" }] }),
  m: () => ({ name:"", pos:"", role:"กรรมการ" }),
  survey: () => ({ n:"ด้าน", items:[{ t:"", f:["", "", "", "", ""] }] }),
  items: () => ({ t:"", f:["", "", "", "", ""] })
};
editEl.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b) return;
  const act = b.dataset.act, arr = b.dataset.arr ? getPath(P, b.dataset.arr) : null, i = +b.dataset.i;
  switch (act){
    case "print": return window.print();
    case "word": return saveWord();
    case "add": arr.push(TPL[b.dataset.arr.split(".").pop()]()); break;
    case "del": arr.splice(i, 1); break;
    case "up": if (i > 0) [arr[i - 1], arr[i]] = [arr[i], arr[i - 1]]; break;
    case "ph-del": { const p = P.photos.splice(i, 1)[0]; if (p){ delete MEDIA[p.id]; IDB.del(p.id); } break; }
    case "logo-del": if (P.logo){ delete MEDIA[P.logo]; IDB.del(P.logo); P.logo = ""; } break;
    case "act-copy": P.budget.forEach(x => { x.a = String(lineAmt(x)); }); break;
    case "imp-budget": return importBudget();
    case "imp-sched": return importSched();
    case "imp-teach": return importTeachers();
    case "export": return exportProject();
    case "new": return resetTo(blankProject(), "เริ่มโครงการใหม่ด้วยแม่แบบว่าง? ข้อมูลโครงการเดิมในเครื่องนี้จะถูกแทนที่ (บันทึกไฟล์โครงการไว้ก่อนได้)");
    case "sample": return resetTo(defProject(), "โหลดตัวอย่างโครงการติวเข้มแทนข้อมูลเดิม?");
    default: return;
  }
  save(); renderAll();
});
$("#btnPrint").onclick = () => window.print();
$("#btnWord").onclick = saveWord;
$("#btnToggle").onclick = () => $("#app").classList.toggle("showprev");
window.addEventListener("storage", e => {
  if (e.key === "nk_settings"){ try { S = Object.assign({}, DEF_S, JSON.parse(e.newValue || "{}")); } catch (x) {} renderAll(); }
});

/* ═══════════ เริ่มต้น ═══════════ */
(async () => {
  renderAll();
  if (await IDB.open()){
    Object.assign(MEDIA, await IDB.all());
    if (P.logo || P.photos.length) renderAll();
  }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (doc().toc) fillToc(); });
})();
</script>
